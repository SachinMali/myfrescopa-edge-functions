kind: 'CDN'
version: '1'
data:
  originSelectors:
    rules:
      - name: route-estimated-delivery-to-edge-function
        when: { reqProperty: path, equals: "/api/frescopa/estimated-delivery" }
        action:
          type: selectAemOrigin
          originName: edgefunction-my-edge-function
          skipCache: true
      - name: route-hello-world-to-edge-function
        when: { reqProperty: path, equals: "/hello-world" }
        action:
          type: selectAemOrigin
          originName: edgefunction-my-edge-function
          skipCache: true
  authentication:
    authenticators:
      - name: frescopa-google-oidc
        type: oidc        
        clientId: "585724821762-fvi7h3ggmsnjk03qn07ot57o9tdm0akl.apps.googleusercontent.com"
        clientSecret: ${{FRESCOPA_OIDC_CLIENT_SECRET}}
        authEndpoint: "https://accounts.google.com/o/oauth2/v2/auth"
        tokenEndpoint: "https://oauth2.googleapis.com/token"
        jwksUri: "https://www.googleapis.com/oauth2/v3/certs"
        issuer: "https://accounts.google.com"
        domainMatch: "^dev-myfrescopa\\.enablementadobe\\.com$"
        callback: /callback
        login: /login
        loginTarget: /dev/branches/oidc/members/welcome
        logout: /logout
        logoutTarget: /dev/branches/oidc/sign-out
        additionalScopes: [profile]   # base is openid + email; adds name, given_name, family_name, picture
    rules:
      - name: frescopa-members-rule
        when:
          allOf:
            - { reqProperty: domain, equals: "dev-myfrescopa.enablementadobe.com" }
            - { reqProperty: path, matches: "^(/dev/branches/[^/]+)?/members/.*" }
        action:
          type: authenticate
          authenticator: frescopa-google-oidc
      # oidcUserEmail decodes the JWT payload from the _aem_oidc_id_token cookie.
      - name: frescopa-respond-with-user-email
        when:
          allOf:
            - { reqProperty: domain, equals: "dev-myfrescopa.enablementadobe.com" }
            - { reqProperty: path, equals: /members/email }
        action:
          type: respond
          status: 200
          body:
            authProperty: oidcUserEmail
      # oidcIdToken decodes the JWT payload from the _aem_oidc_id_token cookie.
      - name: frescopa-respond-with-id-token
        when:
          allOf:
            - { reqProperty: domain, equals: "dev-myfrescopa.enablementadobe.com" }
            - { reqProperty: path, equals: /members/idtoken }
        action:
          type: respond
          status: 200
          body:
            authProperty: oidcIdToken
